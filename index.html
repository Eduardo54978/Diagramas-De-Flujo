<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama de Flujo - Editor</title>
    <link rel="stylesheet" type="text/css" href="css/w3.css">
    <link rel="stylesheet" type="text/css" href="css/font-awesome-4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <h2><i class="fa fa-pencil"></i> Herramientas</h2>
            <h3 style="margin-bottom: 10px; color: #666;">Figuras</h3>
            <div class="shape-palette">
                <button class="shape-btn" data-shape="inicio">
                    <i class="fa fa-circle"></i>
                    <span>Inicio</span>
                </button>
                <button class="shape-btn" data-shape="proceso">
                    <i class="fa fa-square"></i>
                    <span>Proceso</span>
                </button>
                <button class="shape-btn" data-shape="decision">
                    <i class="fa fa-diamond"></i>
                    <span>Decisión</span>
                </button>
                <button class="shape-btn" data-shape="entrada">
                    <i class="fa fa-sign-in"></i>
                    <span>Entrada</span>
                </button>
                <button class="shape-btn" data-shape="salida">
                    <i class="fa fa-sign-out"></i>
                    <span>Salida</span>
                </button>
                <button class="shape-btn" data-shape="fin">
                    <i class="fa fa-circle-o"></i>
                    <span>Fin</span>
                </button>
            </div>

            <h3 style="margin-bottom: 10px; color: #666;">Acciones</h3>
            <div class="actions">
                <button class="action-btn" id="saveBtn">
                    <i class="fa fa-save"></i> Guardar Diagrama
                </button>
                <button class="action-btn" id="loadBtn">
                    <i class="fa fa-folder-open"></i> Cargar Diagrama
                </button>
                <button class="action-btn" id="exportBtn">
                    <i class="fa fa-download"></i> Exportar JSON
                </button>
                <button class="action-btn danger" id="clearBtn">
                    <i class="fa fa-trash"></i> Limpiar Canvas
                </button>
            </div>
            <div class="info-panel">
                <h3>ℹ️ Instrucciones</h3>
                <p>• Click en una figura del panel<br>
                • Click en el canvas para colocarla<br>
                • Arrastra las figuras para moverlas<br>
                • Click derecho para eliminar</p>
            </div>
        </div>
        <div class="canvas-container">
            <svg id="canvas">
                <defs>
                    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 0 L 0 0 0 20" class="grid-pattern"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#grid)"/>
                <g id="arrows-layer"></g>
                <g id="shapes-layer"></g>
            </svg>
        </div>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/shapes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
